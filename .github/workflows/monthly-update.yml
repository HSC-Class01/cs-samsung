name: Monthly DART update

on:
  schedule:
    - cron: "0 0 1 * *" # 09:00 KST on the first day of each month
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.json"
      - ".github/workflows/monthly-update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monthly-dart-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect DART reports and calculate metrics
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/update_dart.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- docs/data; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "chore: refresh DART financial data"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
