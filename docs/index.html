<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼성전자 DART 재무 대시보드</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{--surface:#FDFDFF;--ink:#1E2433;--ink2:#505A74;--grid:#E2E6F0;--blue:#1751D0;--orange:#E2661E;--aqua:#0E9E8F}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}header{background:var(--surface);border-bottom:1px solid var(--grid);padding:28px max(20px,calc((100% - 1200px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}header p{margin:6px 0 0;color:var(--ink2);font-size:14px}.wrap{max-width:1200px;margin:auto;padding:24px 20px 48px}.controls{display:flex;gap:12px;align-items:center;margin-bottom:18px}select{padding:9px 12px;border:1px solid #cbd2df;border-radius:8px;background:white}.kpis,.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.kpi,.panel{background:white;border:1px solid var(--grid);border-radius:14px;padding:18px;box-shadow:0 3px 12px #1e243308}.kpi small,.sub{color:var(--ink2)}.kpi strong{display:block;font-size:27px;margin-top:7px}.charts{margin-top:16px}.panel{min-width:0}.panel.wide{grid-column:span 2}.panel h2{font-size:16px;margin:0 0 14px}canvas{max-height:280px}section{margin-top:32px}section>h2{font-size:19px;margin-bottom:6px}table{width:100%;border-collapse:collapse;font-size:13px;background:white;border:1px solid var(--grid);border-radius:14px;overflow:hidden}th{text-align:left;background:#f3f6fc;color:var(--ink2);font-weight:650}th,td{padding:11px 12px;border-bottom:1px solid var(--grid);white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}.scroll{overflow:auto}.empty{padding:24px;color:var(--ink2);background:white;border:1px dashed #b7c0d1;border-radius:12px}a{color:var(--blue)}footer{margin-top:28px;color:var(--ink2);font-size:12px}@media(max-width:700px){header{display:block}.panel.wide{grid-column:span 1}}
</style></head><body><header><div><h1>삼성전자 DART 재무 대시보드</h1><p>OpenDART 정기공시 기반 · 매월 1일 09:00 KST 자동 갱신</p></div><a href="https://dart.fss.or.kr" target="_blank" rel="noreferrer">DART 열기 ↗</a></header><main class="wrap"><div class="controls"><label>보고서 구분 <select id="category"><option value="annual">Annual</option><option value="half-year">Half-year</option><option value="quarterly">Quarterly</option></select></label></div><div id="empty" class="empty">데이터를 불러오는 중입니다…</div><div id="content" hidden><div class="kpis" id="kpis"></div><div class="charts"><div class="panel wide"><h2>매출액 · 영업이익 추이 (조원)</h2><canvas id="incomeChart"></canvas></div><div class="panel"><h2>수익성 지표 (%)</h2><canvas id="ratioChart"></canvas></div></div><section><h2>주요 재무 수치</h2><p class="sub">금액 단위: 억원 · Annual / Half-year / Quarterly 전체 테이블</p><div id="allTables"></div></section><section><h2>국내 Peer Firms</h2><div class="scroll"><table><thead><tr><th>기업</th><th>종목코드</th><th>선정 근거</th></tr></thead><tbody id="peerBody"></tbody></table></div></section></div><footer>재무 수치는 OpenDART XBRL 정기공시에서 자동 수집됩니다. 2010년부터 보고서 메타데이터를 수집하며 XBRL 재무수치 수집은 2015년부터 지원됩니다.</footer></main><script>
let DATA=[],charts=[];const won=v=>v==null?'—':(v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0});const pct=v=>v==null?'—':v.toFixed(1)+'%';
async function load(){try{[DATA,peers]=await Promise.all(['data/financials.json','data/peer_firms.json'].map(x=>fetch(x).then(r=>r.json())));document.querySelector('#peerBody').innerHTML=peers.map(p=>`<tr><td>${p.name}</td><td>${p.ticker}</td><td>${p.rationale}</td></tr>`).join('');render()}catch(e){document.querySelector('#empty').textContent='데이터를 읽지 못했습니다. GitHub Actions에서 DART_API_KEY를 설정한 뒤 수동 실행해 주세요.'}}
function render(){let c=category.value,rows=DATA.filter(x=>x.category===c).sort((a,b)=>a.year-b.year||String(a.period_label||'').localeCompare(String(b.period_label||'')));if(!rows.length){empty.hidden=false;content.hidden=true;empty.textContent='아직 게시된 데이터가 없습니다. README의 API 설정 후 워크플로를 실행해 주세요.';return}empty.hidden=true;content.hidden=false;let last=rows.at(-1);kpis.innerHTML=[['매출액',won(last.revenue)+' 억원'],['영업이익',won(last.operating_income)+' 억원'],['순이익률',pct(last.net_margin)],['ROE',pct(last.roe)]].map(x=>`<div class="kpi"><small>${x[0]} · ${last.period_label||last.year}</small><strong>${x[1]}</strong></div>`).join('');allTables.innerHTML=['annual','half-year','quarterly'].map(kind=>{let rs=DATA.filter(x=>x.category===kind).sort((a,b)=>b.year-a.year||String(b.period_label||'').localeCompare(String(a.period_label||'')));return `<h3>${kind}</h3><div class="scroll"><table><thead><tr><th>기간</th><th>매출액</th><th>영업이익</th><th>당기순이익</th><th>자산</th><th>부채</th><th>자본</th><th>유동비율</th><th>부채비율</th><th>ROE</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${r.period_label||r.year}</td>${['revenue','operating_income','net_income','assets','liabilities','equity'].map(k=>`<td class="num">${won(r[k])}</td>`).join('')}<td class="num">${pct(r.current_ratio)}</td><td class="num">${pct(r.debt_to_equity)}</td><td class="num">${pct(r.roe)}</td></tr>`).join('')}</tbody></table></div>`}).join('');charts.forEach(x=>x.destroy());charts=[];let labels=rows.map(r=>r.period_label||r.year);const common={responsive:true,maintainAspectRatio:false,scales:{y:{grid:{color:'#E2E6F0'}}}};charts.push(new Chart(incomeChart,{type:'line',data:{labels,datasets:[{label:'매출액',data:rows.map(r=>r.revenue/1e12),borderColor:'#1751D0',backgroundColor:'#1751D0',tension:.25},{label:'영업이익',data:rows.map(r=>r.operating_income/1e12),borderColor:'#E2661E',backgroundColor:'#E2661E',tension:.25}]},options:common}));charts.push(new Chart(ratioChart,{type:'line',data:{labels,datasets:[{label:'영업이익률',data:rows.map(r=>r.operating_margin),borderColor:'#0E9E8F',backgroundColor:'#0E9E8F',tension:.25},{label:'ROE',data:rows.map(r=>r.roe),borderColor:'#9117D0',backgroundColor:'#9117D0',tension:.25}]},options:common}))}category.onchange=render;load();
</script></body></html>
